name: Build WORLD MESSENGER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: |
          flutter create \
            --platforms=android \
            --project-name world_messenger \
            --org com.worldmessenger \
            /tmp/wm_scaffold
          cp -R /tmp/wm_scaffold/android app/android

      - name: Allow local HTTP for development
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )
          s = s.replace(
              "<application",
              '<application android:usesCleartextTraffic="true"',
              1
          )
          p.write_text(s)
          PYTHON

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: world-messenger-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
