name: Build WORLD MESSENGER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: |
          flutter create \
            --platforms=android \
            --project-name world_messenger \
            --org com.worldmessenger \
            /tmp/wm_scaffold
          cp -R /tmp/wm_scaffold/android app/android

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: world-messenger-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
